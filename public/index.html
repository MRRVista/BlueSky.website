<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Sign in | Blue Sky Investment Group</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="sky">
    <main>
      <img class="logo" src="/logo.webp" alt="Blue Sky Investment Group LLC" width="479" height="340">
      <form class="panel" id="login" novalidate>
        <h1>Sign in</h1>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="username" required autofocus>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn-primary" type="submit">Sign in</button>
        <p class="message" id="message" role="status" aria-live="polite"></p>
      </form>
    </main>
    <footer>Blue Sky Investment Group LLC</footer>
  </div>

  <script>
    // Already signed in? Go straight in.
    fetch("/api/me", { credentials: "same-origin" })
      .then((r) => (r.ok ? location.replace("/home") : null))
      .catch(() => {});

    const form = document.getElementById("login");
    const msg = document.getElementById("message");
    const button = form.querySelector("button");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = form.email.value.trim();
      const password = form.password.value;
      if (!email || !password) {
        msg.dataset.kind = "error";
        msg.textContent = "Enter your email and password.";
        return;
      }
      button.disabled = true;
      button.textContent = "Signing in…";
      msg.textContent = "";
      try {
        const r = await fetch("/api/login", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });
        const data = await r.json().catch(() => ({}));
        if (r.ok) {
          location.replace(data.redirect || "/home");
          return;
        }
        msg.dataset.kind = "error";
        msg.textContent = data.error || "Sign-in failed. Try again.";
        form.password.select();
      } catch {
        msg.dataset.kind = "error";
        msg.textContent = "Can't reach the server. Check your connection and try again.";
      }
      button.disabled = false;
      button.textContent = "Sign in";
    });
  </script>
</body>
</html>
